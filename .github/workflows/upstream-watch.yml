---
name: AIOZ upstream watch

# Daily check of the AIOZ DePIN hub and CLI repository while the hub is down
# and v1.2.6 is broken. Comments on the "AIOZ upstream watch" issue on change.
# The script tests run on every pull request that touches it.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/upstream-watch.yml'

permissions:
  contents: read  # checkout

# One run per pull request or branch; a newer push to a pull request cancels
# the older run, a scheduled watch is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test the watch scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Unit tests
        run: .github/scripts/tests/run.sh

  watch:
    name: Watch the upstream hub and CLI
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # checkout
      issues: write  # comment on the upstream watch issue
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/upstream-watch.sh
