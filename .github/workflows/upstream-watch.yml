name: AIOZ upstream watch

# Daily check of the AIOZ DePIN hub and CLI repository while the hub is down
# and v1.2.6 is broken. Comments on the "AIOZ upstream watch" issue on change.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check upstream
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: .github/scripts/upstream-watch.sh
