---
name: Docker Image CI

on:
  push:
    tags:
      - 'v*'  # Pushed tags starting with 'v' (e.g., v1.0.0)

# Read-only by default: build and quick_test run code from the repository and
# the AIOZ binary (which receives GITHUB_TOKEN). Only the release job, which
# runs neither, may write.
permissions:
  contents: read  # checkout; the release job asks for more

# One release at a time: two tags must not push :latest concurrently.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  build:
    name: Build, test and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          echo "$DOCKER_PASSWORD" |
            docker login -u "$DOCKER_USER" --password-stdin

      - name: docker build
        run: |
          docker build -t aioznode . \
          --tag rinzlerfr/aioznode:quicktest \
          --tag rinzlerfr/aioznode:latest \
          --tag "rinzlerfr/aioznode:$GITHUB_REF_NAME"

      - name: Unit tests
        run: tests/run.sh

      - name: Quick Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./quick_test.sh rinzlerfr/aioznode:quicktest

      - name: docker push
        run: |
          docker push "rinzlerfr/aioznode:$GITHUB_REF_NAME"
          docker push rinzlerfr/aioznode:latest

  release:
    name: Create the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # gh release create

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --notes "Automated release for $GITHUB_REF_NAME."
