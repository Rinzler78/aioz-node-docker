---
name: Docker Image CI

on:
  push:
    tags:
      - 'v*'  # Pushed tags starting with 'v' (e.g., v1.0.0)

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Extract tag name
        id: extract_tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          echo "$DOCKER_PASSWORD" |
            docker login -u "$DOCKER_USER" --password-stdin

      - name: docker build
        run: |
          docker build -t aioznode . \
          --tag rinzlerfr/aioznode:quicktest \
          --tag rinzlerfr/aioznode:latest \
          --tag rinzlerfr/aioznode:${{ steps.extract_tag.outputs.tag_name }}

      - name: Unit tests
        run: tests/run.sh

      - name: Quick Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./quick_test.sh rinzlerfr/aioznode:quicktest

      - name: docker push
        env:
          TAG: ${{ steps.extract_tag.outputs.tag_name }}
        run: |
          docker push "rinzlerfr/aioznode:$TAG"
          docker push rinzlerfr/aioznode:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_tag.outputs.tag_name }}
          name: Release ${{ steps.extract_tag.outputs.tag_name }}
          body: |
            Automated release for ${{ steps.extract_tag.outputs.tag_name }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
